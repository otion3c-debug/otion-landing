<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Received — Otion LLC</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #ffffff; --text: #0b1120; --accent: #10B981;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-head: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: #f8f9fa;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: var(--bg);
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .check {
      width: 64px; height: 64px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .check svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    h1 {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p { color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn:hover { background: #059669; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Payment Received!</h1>
    <p>Thank you for your payment. Your transaction has been processed securely. You'll receive a receipt via email from Stripe.</p>
    <p style="font-size:0.9rem;">If you subscribed to a monthly service, we'll handle everything from here. If you paid an invoice, we'll be in touch shortly.</p>
    <a href="https://otion.solutions" class="btn">Back to Otion</a>
  </div>
</body>
</html>
